              }
            });

        if (document.visibilityState === "visible" && window.swRegistration) {

      setInterval(function () {
        if (navigator.onLine && window.swRegistration) {

        if (window.swRegistration) {

        if (e.data && e.data.type === "SW_UPDATED") {
          window.dispatchEvent(new CustomEvent("swUpdateAvailable"));
        }
      });

      navigator.serviceWorker.addEventListener("controllerchange", function () { window.dispatchEvent(new CustomEvent("swRefreshed")); });
    }

function CustomizationModal({ item, initialEditItem, onClose, onSave }) {
  const isDrink = item.type === "drink";
  const isBakery = item.type === "bakery";

  const existing = initialEditItem?.customization || {};

  const [size, setSize] = useState(existing.size || "md");
  const [temp, setTemp] = useState(existing.temp || item.defaultTemp || "hot");
  const [milk, setMilk] = useState(existing.milk || item.defaultMilk || "whole");
  const [shots, setShots] = useState(existing.shots || item.defaultShots || "standard");
  const [sweetness, setSweetness] = useState(existing.sweetness || "100");
  const [ice, setIce] = useState(existing.ice || "regular");
  const [syrups, setSyrups] = useState(existing.syrups || item.defaultSyrups || []);
  const [toppings, setToppings] = useState(existing.toppings || item.defaultToppings || []);
  const [warming, setWarming] = useState(existing.warming || "warmed");
  const [spreads, setSpreads] = useState(existing.spreads || []);
  const [notes, setNotes] = useState(existing.notes || "");
  const [quantity, setQuantity] = useState(initialEditItem?.quantity || 1);

  const toggleArrayItem = (list, setList, id) => {
    if (list.includes(id)) {
      setList(list.filter((x) => x !== id));
    } else {
      setList([...list, id]);
    }
  };

  const unitPrice = useMemo(() => {
    let total = item.price;
    if (isDrink) {
      const sizeObj = MODIFIERS.sizes.find((s) => s.id === size);
      if (sizeObj) total += sizeObj.price;

      const milkObj = MODIFIERS.milks.find((m) => m.id === milk);
      if (milkObj && milk !== item.defaultMilk) {
        total += milkObj.price;
      } else if (milkObj && milk === item.defaultMilk && milkObj.price > 0 && !item.defaultMilk) {
        total += milkObj.price;
      }

      const shotObj = MODIFIERS.shots.find((sh) => sh.id === shots);
      if (shotObj && shots !== (item.defaultShots || "standard")) {
        total += shotObj.price;
      }

      syrups.forEach((sId) => {
        if (!(item.defaultSyrups || []).includes(sId)) {
          const sObj = MODIFIERS.syrups.find((s) => s.id === sId);
          if (sObj) total += sObj.price;
        }
      });

      toppings.forEach((tId) => {
        if (!(item.defaultToppings || []).includes(tId)) {
          const tObj = MODIFIERS.toppings.find((t) => t.id === tId);
          if (tObj) total += tObj.price;
        }
      });
    } else if (isBakery) {
      spreads.forEach((spId) => {
        const spObj = MODIFIERS.bakerySpreads.find((s) => s.id === spId);
        if (spObj) total += spObj.price;
      });
    }
    return Math.max(0.5, Number(total.toFixed(2)));
  }, [item, isDrink, isBakery, size, milk, shots, syrups, toppings, spreads]);

  const handleConfirm = () => {
    let customization = {};
    if (isDrink) {
      const sizeObj = MODIFIERS.sizes.find((s) => s.id === size);
      const tempObj = MODIFIERS.temperatures.find((t) => t.id === temp);
      const milkObj = MODIFIERS.milks.find((m) => m.id === milk);
      const shotObj = MODIFIERS.shots.find((s) => s.id === shots);
      const sweetObj = MODIFIERS.sweetness.find((s) => s.id === sweetness);
      const iceObj = MODIFIERS.iceLevels.find((i) => i.id === ice);

      customization = {
        size,
        sizeLabel: sizeObj ? `${sizeObj.name} (${sizeObj.oz})` : "Medium",
        temp,
        tempLabel: tempObj ? tempObj.name : "Hot",
        milk,
        milkLabel: milkObj ? milkObj.name : "Whole Milk",
        shots,
        shotsLabel: shotObj ? shotObj.name : "Standard Double (2)",
        sweetness,
        sweetnessLabel: sweetObj ? sweetObj.name : "100% Standard",
        ice: temp === "iced" ? ice : "none",
        iceLabel: temp === "iced" && iceObj ? iceObj.name : "",
        syrups,
        syrupLabels: syrups.map((id) => MODIFIERS.syrups.find((s) => s.id === id)?.name).filter(Boolean),
        toppings,
        toppingLabels: toppings.map((id) => MODIFIERS.toppings.find((t) => t.id === id)?.name).filter(Boolean),
        notes: notes.trim()
      };
    } else if (isBakery) {
      const warmObj = MODIFIERS.bakeryOptions.find((w) => w.id === warming);
      customization = {
        warming,
        warmingLabel: warmObj ? warmObj.name : "Warmed in Oven",
        spreads,
        spreadLabels: spreads.map((id) => MODIFIERS.bakerySpreads.find((s) => s.id === id)?.name).filter(Boolean),
        notes: notes.trim()
      };
    } else {
      customization = {
        notes: notes.trim()
      };
    }

    onSave({
      lineId: initialEditItem?.lineId || `L-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      itemId: item.id,
      name: item.name,
      sku: item.sku,
      type: item.type,
      quantity,
      unitPrice,
      completed: false,
      customization
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-stone-950/75 backdrop-blur-sm p-0 sm:p-4">
      <div className="bg-stone-900 border-t sm:border border-stone-700/80 rounded-t-2xl sm:rounded-2xl max-w-3xl w-full max-h-[92dvh] flex flex-col shadow-2xl overflow-hidden text-stone-100">
        {/* Header */}
        <div className="flex items-center justify-between px-6 py-4 bg-stone-800/80 border-b border-stone-700">
          <div className="flex items-center gap-3">
            {item.imageUrl && (
              <img
                src={item.imageUrl}
                alt={item.name}
                className="w-11 h-11 rounded-xl object-cover border border-amber-500/40 shadow-inner shrink-0 header-prod-img"
              />
            )}
            <div
              className={`w-11 h-11 rounded-xl flex items-center justify-center font-bold text-white shadow-inner shrink-0 ${item.imageUrl ? 'hidden' : 'flex'}`}
              style={{ backgroundColor: item.color || "#7c4a2d" }}
            >
              {item.sku.split("-")[0]}
            </div>
            <div>
              <h2 className="text-lg font-bold text-amber-50 flex items-center gap-2">
                {item.name}
                <span className="text-xs font-normal px-2 py-0.5 rounded bg-stone-700 text-stone-300">
                  Base ₱{item.price.toFixed(2)}
                </span>
              </h2>
              <p className="text-xs text-stone-400">{item.description}</p>
            </div>
          </div>
          <button
            onClick={onClose}
            className="p-2 rounded-lg text-stone-400 hover:text-white hover:bg-stone-700 transition"
          >
            ✕
          </button>
        </div>

        {/* Body */}
        <div className="p-6 overflow-y-auto space-y-6 flex-1">
          {isDrink && (
            <>
              {/* Size & Temperature Row */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-amber-400 mb-2">
                    1. Cup Size
                  </label>
                  <div className="grid grid-cols-3 gap-2">
                    {MODIFIERS.sizes.map((s) => (
                      <button
                        key={s.id}
                        type="button"
                        onClick={() => setSize(s.id)}
                        className={`p-3 rounded-xl border text-left transition ${
                          size === s.id
                            ? "bg-amber-600/20 border-amber-500 text-amber-200 ring-1 ring-amber-500"
                            : "bg-stone-800/70 border-stone-700 text-stone-300 hover:border-stone-500"
                        }`}
                      >
                        <div className="font-semibold text-sm">{s.name}</div>
                        <div className="text-xs text-stone-400">{s.oz}</div>
                        <div className="text-xs font-medium text-amber-400 mt-1">
                          {s.price === 0
                            ? "Base"
                            : s.price > 0
                            ? `+₱${s.price.toFixed(2)}`
                            : `-₱${Math.abs(s.price).toFixed(2)}`}
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                <div>

                          }`}
                        >

                          <div className="text-xs text-stone-400">
                            {t.id === "iced" ? "Over Ice" : "Steamed"}

}



function CheckoutModal({
  subtotal,
  discountAmount,
  taxAmount,
  baseTotal,
  customerName,
  orderType,
  tableNumber,
  onClose,
  onCompleteOrder
}) {
  const [paymentMethod, setPaymentMethod] = useState("cash"); // cash | card | mobile
  const [tipMode, setTipMode] = useState("0"); // 0 | 5 | 10 | 15 | 20 | custom
  const [customTip, setCustomTip] = useState("");
  const [cashTenderedStr, setCashTenderedStr] = useState("");
  const [isProcessingCard, setIsProcessingCard] = useState(false);

  const tipAmount = useMemo(() => {
    if (tipMode === "0") return 0;
    if (tipMode === "custom") {
      const val = parseFloat(customTip);
      return isNaN(val) || val < 0 ? 0 : Number(val.toFixed(2));
    }
    const pct = parseFloat(tipMode) / 100;
    return Number((subtotal * pct).toFixed(2));
  }, [tipMode, customTip, subtotal]);

  const finalTotal = useMemo(() => {
    return Number((baseTotal + tipAmount).toFixed(2));
  }, [baseTotal, tipAmount]);

  const cashTendered = useMemo(() => {
    if (!cashTenderedStr) return finalTotal;
    const val = parseFloat(cashTenderedStr);
    return isNaN(val) ? 0 : val;
  }, [cashTenderedStr, finalTotal]);

  const changeDue = useMemo(() => {
    if (paymentMethod !== "cash") return 0;
    return Math.max(0, Number((cashTendered - finalTotal).toFixed(2)));
  }, [paymentMethod, cashTendered, finalTotal]);

  const canCompleteCash = paymentMethod !== "cash" || cashTendered >= finalTotal - 0.001;

  const quickCashAmounts = useMemo(() => {
    const exact = finalTotal;
    const nextFifty = Math.ceil(finalTotal / 50) * 50;
    const bills = [100, 200, 500, 1000, 2000];
    const validBills = bills.filter((b) => b >= finalTotal);
    const set = new Set([exact, nextFifty, ...validBills]);
    return Array.from(set).slice(0, 5);
  }, [finalTotal]);

  const handleKeypad = (key) => {
    if (key === "C") {
      setCashTenderedStr("");
      return;
    }
    if (key === "⌫") {
      setCashTenderedStr((prev) => prev.slice(0, -1));
      return;
    }
    if (key === "." && cashTenderedStr.includes(".")) return;
    setCashTenderedStr((prev) => `${prev}${key}`);
  };

  const handleSubmit = () => {
    if (!canCompleteCash) return;

    const methodLabels = {
      cash: "Cash",
      card: "Card (•••• 4829)",
      mobile: "GCash / Maya / QR Ph"
    };

    if (paymentMethod !== "cash") {
      setIsProcessingCard(true);
      setTimeout(() => {
        setIsProcessingCard(false);
        onCompleteOrder({
          paymentMethod: methodLabels[paymentMethod],
          tip: tipAmount,
          total: finalTotal,
          amountTendered: finalTotal,
          changeDue: 0
        });
      }, 650);
    } else {
      onCompleteOrder({
        paymentMethod: "Cash",
        tip: tipAmount,
        total: finalTotal,
        amountTendered: Number(cashTendered.toFixed(2)),
        changeDue
      });
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-stone-950/80 backdrop-blur-sm p-0 sm:p-4">
      <div className="bg-stone-900 border-t sm:border border-stone-700 rounded-t-2xl sm:rounded-2xl max-w-3xl w-full max-h-[92dvh] flex flex-col overflow-hidden shadow-2xl text-stone-100">
        {/* Header */}
        <div className="px-4 sm:px-6 py-3.5 sm:py-4 bg-stone-800 border-b border-stone-700 flex items-center justify-between shrink-0">
          <div>
            <h2 className="text-base sm:text-lg font-bold text-amber-50">
              Complete Payment & Send to Barista
            </h2>
            <p className="text-xs text-stone-400">
              {orderType} {tableNumber ? `• ${tableNumber}` : ""} • Customer:{" "}
              <span className="text-amber-300 font-medium">{customerName || "Walk-In Guest"}</span>
            </p>
          </div>
          <button
            onClick={onClose}
            className="p-2 rounded-lg text-stone-400 hover:text-white hover:bg-stone-700"
          >
            ✕
          </button>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-12 overflow-y-auto flex-1">
          {/* Left Column: Summary & Tip */}
          <div className="md:col-span-5 p-6 bg-stone-900/60 border-b md:border-b-0 md:border-r border-stone-800 flex flex-col justify-between space-y-6">
            <div className="space-y-4">
              <div className="p-4 rounded-xl bg-stone-800/80 border border-stone-700/80 space-y-2 text-sm">
                <div className="flex justify-between text-stone-300">
                  <span>Subtotal</span>
                  <span>₱{subtotal.toFixed(2)}</span>
                </div>
                {discountAmount > 0 && (
                  <div className="flex justify-between text-emerald-400">
                    <span>Discount</span>
                    <span>−₱{discountAmount.toFixed(2)}</span>
                  </div>
                )}
                <div className="flex justify-between text-stone-300">
                  <span>12% VAT</span>
                  <span>₱{taxAmount.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-amber-300">
                  <span>Barista Tip</span>
                  <span>+₱{tipAmount.toFixed(2)}</span>
                </div>
                <div className="pt-2 border-t border-stone-700 flex justify-between items-baseline">
                  <span className="font-bold text-base text-white">Total Due</span>
                  <span className="text-2xl font-extrabold text-amber-400">
                    ₱{finalTotal.toFixed(2)}
                  </span>
                </div>
              </div>

              {/* Tip Selector */}
              <div>
                <label className="block text-xs font-semibold uppercase tracking-wider text-stone-400 mb-2">
                  Add Barista Gratuity
                </label>
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { id: "0", label: "No Tip" },
                    { id: "5", label: "5%" },
                    { id: "10", label: "10%" },
                    { id: "15", label: "15%" },
                    { id: "20", label: "20%" },
                    { id: "custom", label: "Custom ₱" }
                  ].map((t) => (
                    <button
                      key={t.id}
                      type="button"
                      onClick={() => setTipMode(t.id)}
                      className={`py-2 px-2 rounded-xl border text-xs font-semibold transition ${
                        tipMode === t.id
                          ? "bg-amber-600/25 border-amber-500 text-amber-200 ring-1 ring-amber-500"
                          : "bg-stone-800 border-stone-700 text-stone-300 hover:border-stone-500"
                      }`}
                    >
                      {t.label}
                    </button>
                  ))}
                </div>
                {tipMode === "custom" && (
                  <div className="mt-2">
                    <input
                      type="number"
                      step="10"
                      min="0"
                      value={customTip}
                      onChange={(e) => setCustomTip(e.target.value)}
                      placeholder="Enter custom tip (₱)"
                      className="w-full px-3 py-2 rounded-xl bg-stone-800 border border-stone-700 text-sm text-white focus:outline-none focus:border-amber-500"
                    />
                  </div>
                )}
              </div>
            </div>

            {paymentMethod === "cash" && (
              <div className="p-4 rounded-xl bg-emerald-950/40 border border-emerald-700/50">
                <div className="flex justify-between items-center text-xs text-emerald-300 uppercase tracking-wider font-semibold">
                  <span>Cash Tendered</span>
                  <span>₱{cashTendered.toFixed(2)}</span>
                </div>
                <div className="flex justify-between items-baseline mt-1">
                  <span className="text-sm font-bold text-emerald-200">Change Due</span>
                  <span className="text-2xl font-extrabold text-emerald-400">
                    ₱{changeDue.toFixed(2)}
                  </span>
                </div>
              </div>
            )}
          </div>

          {/* Right Column: Payment Method & Tender */}
          <div className="md:col-span-7 p-6 flex flex-col justify-between space-y-5">
            <div>
              <label className="block text-xs font-semibold uppercase tracking-wider text-stone-400 mb-2">
                Select Tender Type
              </label>
              <div className="grid grid-cols-3 gap-2.5">
                {[
                  { id: "cash", label: "💵 Cash (PHP)", sub: "Peso Bills & Coins" },
                  { id: "card", label: "💳 Credit / Debit", sub: "Visa / Mastercard" },
                  { id: "mobile", label: "📱 GCash / Maya", sub: "QR Ph / E-Wallet" }
                ].map((pm) => (
                  <button
                    key={pm.id}
                    type="button"
                    onClick={() => setPaymentMethod(pm.id)}
                    className={`p-3 rounded-xl border text-left transition ${
                      paymentMethod === pm.id
                        ? "bg-amber-600/20 border-amber-500 text-amber-200 ring-1 ring-amber-500"
                        : "bg-stone-800 border-stone-700 text-stone-300 hover:border-stone-500"
                    }`}
                  >
                    <div className="text-sm font-bold">{pm.label}</div>
                    <div className="text-[11px] text-stone-400">{pm.sub}</div>
                  </button>
                ))}
              </div>
            </div>

            {paymentMethod === "cash" ? (
              <div className="space-y-4">
                {/* Quick Bills */}
                <div>
                  <span className="block text-xs text-stone-400 mb-1.5">Quick Cash Tender (PHP)</span>
                  <div className="flex flex-wrap gap-2">
                    {quickCashAmounts.map((amt, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => setCashTenderedStr(amt.toFixed(2))}
                        className="px-3.5 py-2 rounded-xl bg-stone-800 hover:bg-stone-700 border border-stone-600 text-xs font-bold text-amber-300 transition"
                      >
                        {idx === 0 ? `Exact (₱${amt.toFixed(2)})` : `₱${amt.toFixed(2)}`}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Keypad */}
                <div className="space-y-2">
                  <div className="flex items-center justify-between px-4 py-2.5 rounded-xl bg-stone-950 border border-stone-700">
                    <span className="text-xs text-stone-400 uppercase">Tendered Input</span>
                    <span className="text-xl font-mono font-bold text-amber-400">
                      ₱{cashTenderedStr || finalTotal.toFixed(2)}
                    </span>
                  </div>
                  <div className="grid grid-cols-4 gap-2">
                    {["7", "8", "9", "C", "4", "5", "6", "⌫", "1", "2", "3", "00", "0", "."].map(
                      (key) => (
                        <button
                          key={key}
                          type="button"
                          onClick={() => handleKeypad(key)}
                          className={`py-2.5 rounded-xl font-bold text-sm border transition ${
                            key === "C" || key === "⌫"
                              ? "bg-rose-950/50 border-rose-800/60 text-rose-300 hover:bg-rose-900/50"
                              : "bg-stone-800 border-stone-700 text-stone-100 hover:bg-stone-700"
                          } ${key === "0" ? "col-span-2" : ""}`}
                        >
                          {key}
                        </button>
                      )
                    )}
                  </div>
                </div>
              </div>
            ) : (
              <div className="flex-1 flex flex-col items-center justify-center p-6 rounded-2xl bg-stone-950/70 border border-stone-800 text-center space-y-3">
                <div className="w-16 h-16 rounded-full bg-amber-500/15 border border-amber-500/40 flex items-center justify-center text-3xl">
                  {isProcessingCard ? "⏳" : paymentMethod === "card" ? "💳" : "📲"}
                </div>
                <h3 className="text-base font-bold text-amber-100">
                  {isProcessingCard
                    ? "Authorizing Terminal..."
                    : paymentMethod === "card"
                    ? "Terminal Ready — Tap, Insert, or Swipe"
                    : "Scan QR Ph (GCash / Maya)"}
                </h3>
                <p className="text-xs text-stone-400 max-w-xs">
                  Charging <span className="text-amber-300 font-bold">₱{finalTotal.toFixed(2)}</span>{" "}
                  to customer terminal #01. Click below to confirm payment.
                </p>
              </div>
            )}

            {/* Action Buttons */}
            <div className="flex items-center justify-end gap-3 pt-2 border-t border-stone-800">
              <button
                type="button"
                onClick={onClose}
                className="px-5 py-3 rounded-xl border border-stone-700 text-stone-300 hover:bg-stone-800 text-sm font-semibold"
              >
                Back to Cart
              </button>
              <button
                type="button"
                disabled={!canCompleteCash || isProcessingCard}
                onClick={handleSubmit}
                className={`px-6 py-3 rounded-xl font-bold text-sm shadow-lg transition ${
                  !canCompleteCash || isProcessingCard
                    ? "bg-stone-700 text-stone-500 cursor-not-allowed"
                    : "bg-emerald-500 hover:bg-emerald-400 text-stone-950 shadow-emerald-950/50"
                }`}
              >
                {isProcessingCard
                  ? "Processing..."
                  : `Charge ₱${finalTotal.toFixed(2)} & Print Ticket`}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function BaristaKDS({
  orders,
  onUpdateOrderStatus,
  onToggleItemCompleted,
  onToggleOrderPriority,
  onViewReceipt
}) {
  const [now, setNow] = useState(Date.now());
  const [mobileLaneFilter, setMobileLaneFilter] = useState("all"); // all | queued | brewing | ready

  useEffect(() => {
    const timer = setInterval(() => setNow(Date.now()), 5000);
    return () => clearInterval(timer);
  }, []);

  const getElapsedText = (createdAt) => {
    const diffSec = Math.max(0, Math.floor((now - createdAt) / 1000));
    const mins = Math.floor(diffSec / 60);
    const secs = diffSec % 60;
    if (mins === 0) return `${secs}s`;
    return `${mins}m ${secs < 10 ? "0" : ""}${secs}s`;
  };

  const getUrgencyBadge = (createdAt, status) => {
    if (status === "ready" || status === "completed") {
      return "bg-emerald-950/80 text-emerald-300 border-emerald-700/60";
    }
    const mins = (now - createdAt) / 60000;
    if (mins >= 6) return "bg-rose-950/90 text-rose-300 border-rose-600 animate-pulse";
    if (mins >= 3) return "bg-amber-950/90 text-amber-300 border-amber-600";
    return "bg-stone-800 text-stone-300 border-stone-700";
  };

  const activeOrders = orders.filter((o) => o.status !== "completed" && o.status !== "refunded");

  // Sort priority first, then oldest first
  const sortTickets = (list) =>
    [...list].sort((a, b) => {
      if (a.priority !== b.priority) return a.priority ? -1 : 1;
      return a.createdAt - b.createdAt;
    });

  const lanes = [
    {
      id: "queued",
      title: "New / Queued",
      shortTitle: "Queued",
      dotColor: "bg-sky-400",

      shortTitle: "Brewing",
      dotColor: "bg-amber-400",
      badgeColor: "bg-amber-500/20 text-amber-300 border-amber-500/40",
      items: sortTickets(activeOrders.filter((o) => o.status === "brewing"))

    {

        <div>
          <h1 className="text-base sm:text-xl font-bold text-amber-50 flex items-center gap-2">
            <span>☕ Barista Kitchen Display (KDS)</span>
            <span className="text-[11px] px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-700/60 font-medium">
              Live
            </span>
          </h1>
          <p className="text-xs text-stone-400 mt-0.5">
            Tap items to cross off as you steam/pull shots, or bump tickets across stages.
          </p>
        </div>

        {/* Mobile Stage Filter Pills (< lg) */}
        <div className="flex lg:hidden items-center gap-1.5 overflow-x-auto pb-1">
          <button
            type="button"
            onClick={() => setMobileLaneFilter("all")}
            className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap border transition ${
              mobileLaneFilter === "all"
                ? "bg-amber-500 text-stone-950 border-amber-400"
                : "bg-stone-900 text-stone-300 border-stone-800"
            }`}
          >
            All ({activeOrders.length})
          </button>
          {lanes.map((l) => (
            <button
              key={l.id}

              onClick={() => setMobileLaneFilter(l.id)}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap border flex items-center gap-1.5 transition ${
                mobileLaneFilter === l.id
                  ? "bg-amber-500 text-stone-950 border-amber-400"

              }`}

              <span>
                {l.shortTitle} ({l.items.length})
              </span>
            </button>
          ))}
        </div>

        {/* Desktop Summary Counter (lg+) */}
        <div className="hidden lg:flex items-center gap-3">

function OrderHistory({ orders, onViewReceipt, onRefundOrder }) {
  const [searchQuery, setSearchQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");

  const filteredOrders = useMemo(() => {
    return orders.filter((o) => {
      if (statusFilter !== "all" && o.status !== statusFilter) return false;
      if (!searchQuery.trim()) return true;
      const q = searchQuery.toLowerCase();
      return (
        o.orderNumber.toLowerCase().includes(q) ||
        (o.customerName || "").toLowerCase().includes(q) ||
        o.items.some((i) => i.name.toLowerCase().includes(q))
      );
    });
  }, [orders, searchQuery, statusFilter]);

  const stats = useMemo(() => {
    const valid = orders.filter((o) => o.status !== "refunded");
    const revenue = valid.reduce((acc, o) => acc + o.total, 0);
    const tips = valid.reduce((acc, o) => acc + (o.tip || 0), 0);
    const cashTotal = valid
      .filter((o) => o.paymentMethod === "Cash")
      .reduce((acc, o) => acc + o.total, 0);
    const cardTotal = revenue - cashTotal;
    const avgTicket = valid.length > 0 ? revenue / valid.length : 0;

    return {
      count: valid.length,
      revenue,
      tips,
      cashTotal,
      cardTotal,
      avgTicket
    };
  }, [orders]);

  return (
    <div className="flex-1 flex flex-col h-full overflow-y-auto bg-stone-950 p-3 sm:p-6 pb-24 lg:pb-6 space-y-4 sm:space-y-6">

        </div>

        <div className="p-3.5 sm:p-4 rounded-2xl bg-stone-900 border border-stone-800">

            ₱{stats.avgTicket.toFixed(2)}
          </div>
          <div className="text-[11px] text-stone-500 mt-0.5">Per transaction</div>
        </div>

        <div className="p-3.5 sm:p-4 rounded-2xl bg-stone-900 border border-stone-800">

          </div>

            ₱{stats.cashTotal.toFixed(2)}
          </div>
          <div className="text-[11px] text-stone-500 mt-0.5">Physical PHP</div>

        <div className="p-3.5 sm:p-4 rounded-2xl bg-stone-900 border border-stone-800">

  useEffect(() => {
    if (!isOpen) {
      setPinInput("");

  }, []);

  if (!isOpen) return null;

  const activeStaff = staffList.find((s) => s.id === selectedStaffId) || staffList[0];

  const getShiftDuration = (startTime) => {
    if (!startTime) return "0m";
    const diffMs = Math.max(0, now - startTime);
    const hrs = Math.floor(diffMs / (3600 * 1000));
    const mins = Math.floor((diffMs % (3600 * 1000)) / (60 * 1000));
    if (hrs > 0) return `${hrs}h ${mins}m`;
    return `${mins}m`;
  };

  const handleSelectStaff = (staff) => {
    setSelectedStaffId(staff.id);
    setPinInput("");
    setPinError("");
  };

  const handleAttemptLogin = (staffToLog, bypassPin = false) => {
    const target = staffToLog || activeStaff;
    if (!target) return;
    if (!bypassPin && target.pin && pinInput !== target.pin) {
      setPinError("Invalid 4-digit PIN. Try again or tap 1-Tap Quick Clock In.");
      return;
    }
    setPinError("");
    onLogin(target);
  };

  const handleCreateStaff = (e) => {
    e.preventDefault();
    if (!newName.trim()) return;
    const newMember = {
      id: `staff-${Date.now()}`,
      name: newName.trim(),
      role: newRole.trim() || "Barista",
      pin: newPin.trim() || "1234",
      avatar: newAvatar || "☕",
      color: "#F59E0B"
    };
    onAddStaff(newMember);
    setSelectedStaffId(newMember.id);
    setIsAddingNew(false);
    setNewName("");
    onLogin(newMember);
  };

  const handlePinKey = (num) => {
    if (pinInput.length < 4) {
      const next = pinInput + num;
      setPinInput(next);
      setPinError("");
      if (next.length === 4 && activeStaff?.pin) {
        if (next === activeStaff.pin) {
          onLogin(activeStaff);
        } else {
          setPinError("Incorrect PIN. Please re-enter.");
        }
      }
    }
  };

  const handleClearPin = () => {
    setPinInput("");
    setPinError("");
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-950/80 backdrop-blur-sm p-4 overflow-y-auto">
      <div className="bg-stone-900 border border-stone-700 rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl text-stone-100 my-auto">
        {/* Modal Header */}
        <div className="px-5 sm:px-6 py-4 bg-stone-850 border-b border-stone-800 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <span className="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-300 flex items-center justify-center text-lg">
              ☕
            </span>
            <div>
              <h2 className="text-base sm:text-lg font-bold text-amber-50">
                Barista Staff Attendance & Shifts
              </h2>
              <p className="text-xs text-stone-400">
                Register {SHOP_CONFIG.registerId} • Clock-in & Crew Session
              </p>
            </div>
          </div>
          <button
            type="button"
            onClick={onClose}
            className="p-1.5 rounded-lg text-stone-400 hover:text-white hover:bg-stone-800 transition"
          >
            ✕
          </button>
        </div>

        {/* Modal Body */}
        <div className="p-5 sm:p-6 space-y-5 max-h-[80vh] overflow-y-auto">
          {/* Active Logged In Card */}
          {currentStaff ? (
            <div className="p-4 rounded-2xl bg-gradient-to-r from-stone-950 to-stone-900 border border-emerald-500/40 relative shadow-inner">
              <div className="flex items-start justify-between gap-3">
                <div className="flex items-center gap-3">
                  <div
                    className="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl font-bold shadow-md shrink-0"
                    style={{ backgroundColor: currentStaff.color || "#F59E0B" }}
                  >
                    {currentStaff.avatar || "☕"}
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-sm sm:text-base font-extrabold text-white">
                        {currentStaff.name}
                      </span>
                      <span className="px-2 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-[10px] font-bold">
                        🟢 Active on Duty
                      </span>
                    </div>
                    <div className="text-xs text-stone-400 mt-0.5">
                      Role: <strong className="text-amber-300">{currentStaff.role}</strong>
                    </div>
                    <div className="text-[11px] text-stone-400 mt-1 flex items-center gap-2">
                      <span>Shift time: <strong>{getShiftDuration(clockInTime)}</strong></span>
                      <span>•</span>
                      <span>Clocked in at {new Date(clockInTime).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
                    </div>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={onLogout}
                  className="px-3.5 py-2 rounded-xl bg-rose-950/70 hover:bg-rose-900 border border-rose-700/60 text-rose-200 text-xs font-bold transition flex items-center gap-1.5 shadow-sm"
                >
                  <span>🚪 Log Out</span>
                </button>
              </div>
            </div>
          ) : (
            <div className="p-4 rounded-2xl bg-rose-950/30 border border-rose-800/60 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-2xl">🔒</span>
                <div>
                  <div className="text-xs sm:text-sm font-bold text-rose-300">
                    Terminal Logged Out
                  </div>
                  <div className="text-[11px] text-stone-400">
                    Select a barista below to clock in and claim the register.
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Select Staff Grid */}
          <div>
            <div className="flex items-center justify-between mb-2.5">
              <span className="text-xs font-bold uppercase tracking-wider text-amber-400">
                {currentStaff ? "Switch Staff / Take Over Register" : "Select Barista to Clock In"}
              </span>
              <button
                type="button"
                onClick={() => setIsAddingNew(!isAddingNew)}
                className="text-xs text-amber-400 hover:text-amber-300 font-semibold flex items-center gap-1"
              >
                <span>{isAddingNew ? "Cancel" : "➕ Add Barista"}</span>
              </button>
            </div>

            {/* New Staff Form */}
            {isAddingNew && (
              <form
                onSubmit={handleCreateStaff}
                className="mb-4 p-4 rounded-2xl bg-stone-950 border border-amber-500/40 space-y-3"
              >
                <div className="font-bold text-xs text-amber-300">New Crew Member Profile</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[11px] text-stone-400 mb-1">Full Name</label>
                    <input
                      type="text"
                      required
                      value={newName}
                      onChange={(e) => setNewName(e.target.value)}
                      placeholder="e.g. Jordan Cruz"
                      className="w-full px-3 py-1.5 rounded-xl bg-stone-900 border border-stone-700 text-xs text-white placeholder-stone-500 focus:outline-none focus:border-amber-500"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-stone-400 mb-1">Role / Position</label>
                    <select
                      value={newRole}
                      onChange={(e) => setNewRole(e.target.value)}
                      className="w-full px-3 py-1.5 rounded-xl bg-stone-900 border border-stone-700 text-xs text-white focus:outline-none focus:border-amber-500"
                    >
                      <option value="Lead Barista">Lead Barista</option>
                      <option value="Barista">Barista</option>
                      <option value="Senior Barista">Senior Barista</option>
                      <option value="Shift Supervisor">Shift Supervisor</option>
                      <option value="Cashier">Cashier</option>
                      <option value="Store Manager">Store Manager</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[11px] text-stone-400 mb-1">Avatar Icon</label>
                    <div className="flex gap-1.5">
                      {["☕", "✨", "🎯", "🥐", "🌿", "⚡", "🍪"].map((icon) => (
                        <button
                          key={icon}
                          type="button"
                          onClick={() => setNewAvatar(icon)}
                          className={`w-7 h-7 rounded-lg text-sm border flex items-center justify-center transition ${
                            newAvatar === icon
                              ? "bg-amber-500/20 border-amber-400"
                              : "bg-stone-900 border-stone-800"
                          }`}
                        >
                          {icon}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="block text-[11px] text-stone-400 mb-1">Passcode PIN (4 digits)</label>
                    <input
                      type="text"
                      maxLength="4"
                      value={newPin}
                      onChange={(e) => setNewPin(e.target.value.replace(/\D/g, ""))}
                      className="w-full px-3 py-1.5 rounded-xl bg-stone-900 border border-stone-700 text-xs text-white font-mono focus:outline-none focus:border-amber-500"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => setIsAddingNew(false)}
                    className="px-3 py-1.5 rounded-xl bg-stone-800 text-stone-300 text-xs"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold text-xs"
                  >
                    Save & Clock In
                  </button>
                </div>
              </form>
            )}

            {/* Staff Members List */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              {staffList.map((staff) => {
                const isCurrent = currentStaff?.id === staff.id;
                const isSelected = selectedStaffId === staff.id;
                return (
                  <div
                    key={staff.id}
                    onClick={() => handleSelectStaff(staff)}
                    className={`p-3 rounded-2xl border cursor-pointer transition flex items-center justify-between ${
                      isSelected
                        ? "bg-amber-500/15 border-amber-500 ring-1 ring-amber-500/50"
                        : "bg-stone-950/80 hover:bg-stone-800/80 border-stone-800"
                    }`}
                  >
                    <div className="flex items-center gap-2.5 min-w-0">
                      <div
                        className="w-9 h-9 rounded-xl flex items-center justify-center text-lg font-bold shadow-sm shrink-0"
                        style={{ backgroundColor: staff.color || "#8C583A" }}
                      >
                        {staff.avatar || "☕"}
                      </div>
                      <div className="min-w-0">
                        <div className="text-xs sm:text-sm font-bold text-stone-100 truncate flex items-center gap-1.5">
                          <span>{staff.name}</span>
                          {isCurrent && (
                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                          )}
                        </div>
                        <div className="text-[11px] text-stone-400 truncate">{staff.role}</div>
                      </div>
                    </div>

                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        handleAttemptLogin(staff, true);
                      }}
                      className="px-2.5 py-1 rounded-xl bg-stone-800 hover:bg-amber-500 hover:text-stone-950 text-stone-300 text-[11px] font-bold border border-stone-700 transition shrink-0 ml-2"
                    >
                      {isCurrent ? "Active" : "Clock In →"}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Quick PIN Pad for selected staff if switching */}
          {activeStaff && (
            <div className="p-4 rounded-2xl bg-stone-950 border border-stone-800 space-y-3">
              <div className="flex items-center justify-between">
                <span className="text-xs text-stone-400">
                  Clock in as <strong className="text-amber-300">{activeStaff.name}</strong>
                </span>
                <span className="text-[11px] text-stone-500 font-mono">
                  PIN: {activeStaff.pin || "None"}
                </span>
              </div>

              {/* PIN circles */}
              <div className="flex justify-center items-center gap-3 py-1">
                {[0, 1, 2, 3].map((idx) => (
                  <div
                    key={idx}
                    className={`w-3.5 h-3.5 rounded-full border transition ${
                      pinInput.length > idx
                        ? "bg-amber-400 border-amber-400"
                        : "bg-stone-900 border-stone-700"
                    }`}
                  />
                ))}
              </div>

              {pinError && (
                <div className="text-center text-xs text-rose-400 font-semibold">{pinError}</div>
              )}

              {/* Number buttons */}
              <div className="grid grid-cols-3 gap-2 max-w-xs mx-auto">
                {["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "OK"].map((key) => (
                  <button
                    key={key}
                    type="button"
                    onClick={() => {
                      if (key === "C") handleClearPin();
                      else if (key === "OK") handleAttemptLogin(activeStaff, false);
                      else handlePinKey(key);
                    }}
                    className={`py-2 rounded-xl text-xs font-bold transition border ${
                      key === "OK"
                        ? "bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-500"
                        : key === "C"
                        ? "bg-rose-950/40 hover:bg-rose-900 text-rose-300 border-rose-800/50"
                        : "bg-stone-900 hover:bg-stone-800 text-stone-200 border-stone-800"
                    }`}
                  >
                    {key}
                  </button>
                ))}
              </div>

              {/* One-tap Quick Clock In */}
              <button
                type="button"
                onClick={() => handleAttemptLogin(activeStaff, true)}
                className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-stone-950 font-extrabold text-xs shadow-md transition"
              >
                ⚡ 1-Tap Quick Clock In as {activeStaff.name}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function QuickPriceModal({ item, onClose, onSave }) {
  const [priceStr, setPriceStr] = useState(String(item.price.toFixed(2)));

  const handleAdjust = (delta) => {
    const curr = parseFloat(priceStr) || 0;
    const next = Math.max(0, curr + delta);
    setPriceStr(next.toFixed(2));
  };

  const handleSave = () => {
    const num = parseFloat(priceStr);
    if (!isNaN(num) && num >= 0) {
      onSave(item.id, Number(num.toFixed(2)));
      onClose();
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-950/80 backdrop-blur-sm p-4">
      <div className="bg-stone-900 border border-stone-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl text-stone-100 space-y-4">
        <div className="flex items-center justify-between border-b border-stone-800 pb-3">
          <div className="flex items-center gap-2.5">
            <span className="text-xl">💰</span>
            <div>
              <h3 className="font-bold text-sm text-stone-100">Update Product Price</h3>
              <p className="text-xs text-stone-400 truncate max-w-[200px]">{item.name}</p>
            </div>
          </div>
          <button onClick={onClose} className="text-stone-400 hover:text-white text-sm">✕</button>
        </div>

        <div>
          <label className="block text-xs font-semibold text-stone-400 uppercase tracking-wider mb-1.5">
            Price (PHP ₱)
          </label>
          <div className="relative">
            <span className="absolute left-3.5 top-2.5 text-base font-bold text-amber-400">₱</span>
            <input
              type="number"
              step="0.5"
              min="0"
              value={priceStr}
              onChange={(e) => setPriceStr(e.target.value)}
              className="w-full pl-9 pr-4 py-2.5 rounded-xl bg-stone-950 border border-stone-700 text-lg font-mono font-bold text-amber-300 focus:outline-none focus:border-amber-500"
              autoFocus
            />
          </div>
        </div>

        <div className="grid grid-cols-4 gap-2">
          {[-20, -10, +10, +20].map((delta) => (
            <button
              key={delta}
              type="button"
              onClick={() => handleAdjust(delta)}
              className="py-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 text-xs font-bold text-stone-200 border border-stone-700 transition"
            >
              {delta > 0 ? `+₱${delta}` : `-₱${Math.abs(delta)}`}
            </button>
          ))}
        </div>

        <div className="flex items-center justify-end gap-2 pt-2 border-t border-stone-800">
          <button
            type="button"
            onClick={onClose}
            className="px-4 py-2 rounded-xl bg-stone-800 hover:bg-stone-750 text-xs font-semibold text-stone-300"
          >
            Cancel
          </button>
          <button
            type="button"
            onClick={handleSave}
            className="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-stone-950 text-xs font-extrabold shadow"
          >
            Save Price
          </button>
        </div>
      </div>
    </div>
  );
}

function ProductFormModal({ product, isNew, onClose, onSave }) {
  const [name, setName] = useState(product?.name || "");

  const [category, setCategory] = useState(product?.category || "espresso");
  const [type, setType] = useState(product?.type || "drink");

  const [calories, setCalories] = useState(product?.calories !== undefined ? String(product.calories) : "150");
  const [badge, setBadge] = useState(product?.badge || "");
  const [color, setColor] = useState(product?.color || "#8C583A");
  const [description, setDescription] = useState(product?.description || "");
  const [imageUrl, setImageUrl] = useState(product?.imageUrl || "");
  const [defaultTemp, setDefaultTemp] = useState(product?.defaultTemp || "hot");
  const [allowTempChange, setAllowTempChange] = useState(product?.allowTempChange !== undefined ? product.allowTempChange : true);
  const [defaultMilk, setDefaultMilk] = useState(product?.defaultMilk || "whole");
  const [defaultShots, setDefaultShots] = useState(product?.defaultShots || "standard");
  const [imageTab, setImageTab] = useState("file");

  const handleImageFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      alert("Image is larger than 5MB. Please choose a smaller photo.");
      return;
    }
    const reader = new FileReader();
    reader.onload = (event) => {
      setImageUrl(event.target.result);

    reader.readAsDataURL(file);

    e.preventDefault();

function ProductManager({
  menuItems,
  onSaveProduct,
  onDeleteProduct,
  onQuickUpdatePrice,
  onResetMenu
}) {
  const [selectedCategory, setSelectedCategory] = useState("all");
  const [searchQuery, setSearchQuery] = useState("");
  const [editingProduct, setEditingProduct] = useState(null);
  const [quickPriceItem, setQuickPriceItem] = useState(null);
  const [deletingItem, setDeletingItem] = useState(null);
  const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);

  const filteredItems = useMemo(() => {
    return menuItems.filter((item) => {
      if (selectedCategory !== "all" && item.category !== selectedCategory) return false;
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        return (
          item.name.toLowerCase().includes(q) ||
          item.sku.toLowerCase().includes(q) ||
          (item.description && item.description.toLowerCase().includes(q))
        );
      }
      return true;
    });
  }, [menuItems, selectedCategory, searchQuery]);

  const stats = useMemo(() => {
    const total = menuItems.length;
    const withImages = menuItems.filter((m) => !!m.imageUrl).length;
    const avgPrice = total > 0 ? menuItems.reduce((acc, m) => acc + m.price, 0) / total : 0;
    return { total, withImages, avgPrice };
  }, [menuItems]);

  return (
    <div className="flex-1 flex flex-col h-full overflow-hidden bg-stone-950 p-3 sm:p-5 pb-20 lg:pb-5">
      {/* Top Header */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-stone-800 shrink-0">
        <div>
          <h1 className="text-base sm:text-xl font-bold text-amber-50 flex items-center gap-2">
            <span>🏷️ Product & Price Catalog</span>
            <span className="text-[11px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 font-medium">
              {stats.total} Products
            </span>
          </h1>
          <p className="text-xs text-stone-400 mt-0.5">
            Add new products, edit pricing, remove items, and insert product images.
          </p>
        </div>

        <div className="flex items-center gap-2">
          <button
            type="button"
            onClick={() => setIsResetConfirmOpen(true)}
            className="px-3 py-2 rounded-xl bg-stone-900 hover:bg-stone-800 border border-stone-700 text-stone-300 text-xs font-semibold transition"
          >
            🔄 Reset Defaults
          </button>
          <button
            type="button"
            onClick={() => setEditingProduct("new")}
            className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-stone-950 text-xs font-extrabold flex items-center gap-1.5 shadow-lg shadow-amber-950/40 transition"
          >
            <span>➕ Add New Product</span>
          </button>
        </div>
      </div>

      {/* KPI Stats Bar */}
      <div className="grid grid-cols-3 gap-2.5 sm:gap-4 mb-4 shrink-0">
        <div className="p-3 rounded-2xl bg-stone-900 border border-stone-800">
          <div className="text-[10px] sm:text-xs text-stone-400 uppercase font-semibold">Total Menu Items</div>
          <div className="text-base sm:text-xl font-extrabold text-amber-400 mt-0.5">{stats.total} Items</div>
        </div>
        <div className="p-3 rounded-2xl bg-stone-900 border border-stone-800">
          <div className="text-[10px] sm:text-xs text-stone-400 uppercase font-semibold">Items with Photos</div>
          <div className="text-base sm:text-xl font-extrabold text-emerald-400 mt-0.5">
            {stats.withImages} <span className="text-xs font-normal text-stone-400">({Math.round((stats.withImages / Math.max(1, stats.total)) * 100)}%)</span>
          </div>
        </div>
        <div className="p-3 rounded-2xl bg-stone-900 border border-stone-800">
          <div className="text-[10px] sm:text-xs text-stone-400 uppercase font-semibold">Average Price</div>
          <div className="text-base sm:text-xl font-extrabold text-stone-100 mt-0.5">₱{stats.avgPrice.toFixed(2)}</div>
        </div>
      </div>

      {/* Search & Category Filter */}
      <div className="p-2.5 sm:p-3 bg-stone-900/60 border border-stone-800 rounded-2xl mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 shrink-0">
        <div className="relative flex-1">
          <input
            type="text"
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            placeholder="Search by product name, SKU, or description..."

          />
          <span className="absolute left-3 top-2 text-stone-500 text-sm">🔍</span>
          {searchQuery && (
            <button
              type="button"
              onClick={() => setSearchQuery("")}
              className="absolute right-3 top-2 text-xs text-stone-400 hover:text-white"
            >
              ✕
            </button>
          )}
        </div>

        <div className="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
          {CATEGORIES.map((cat) => (

              onClick={() => setSelectedCategory(cat.id)}

              {cat.name}
            </button>

                  <div
                    className="w-full h-full flex flex-col items-center justify-center text-stone-400"
                    style={{ backgroundColor: `${item.color || "#3A2820"}22` }}
                  >
                    <span className="text-3xl opacity-50">☕</span>
                    <span className="text-[11px] text-stone-500 mt-1">No Image Inserted</span>
                  </div>
                )}

                <span className="absolute bottom-1.5 left-1.5 text-[10px] font-mono px-2 py-0.5 rounded bg-stone-950/85 text-amber-300 backdrop-blur-xs border border-stone-800">
                  {item.sku}
                </span>

                <button
                  type="button"
                  onClick={() => setEditingProduct(item)}
                  className="absolute top-1.5 right-1.5 px-2 py-0.5 rounded-lg bg-stone-950/80 hover:bg-amber-500 hover:text-stone-950 text-stone-300 text-[10px] font-bold backdrop-blur-xs border border-stone-700 transition"
                >
                  📷 {item.imageUrl ? "Change Photo" : "Insert Photo"}
                </button>
              </div>

              {/* Title & Badges */}
              <div className="flex items-center gap-1.5 mb-1">
                <span className="text-[10px] px-2 py-0.5 rounded-full bg-stone-800 text-stone-300 font-semibold capitalize">

                {item.badge && (

              <h3 className="font-bold text-sm text-stone-100 leading-snug">{item.name}</h3>
              <p className="text-xs text-stone-400 line-clamp-2 mt-1 leading-relaxed">
                {item.description || "No description provided."}

            {/* Price & Actions Box */}
            <div className="mt-4 pt-3 border-t border-stone-800/80 space-y-2.5">
              <div className="flex items-center justify-between">
                <div>
                  <div className="text-[10px] text-stone-400 uppercase font-semibold">Retail Price</div>
                  <div className="text-lg font-extrabold text-amber-400">
                    ₱{item.price.toFixed(2)}
                  </div>
                </div>

                <button
                  type="button"
                  onClick={() => setQuickPriceItem(item)}
                  className="px-2.5 py-1.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/40 text-amber-300 text-xs font-bold transition flex items-center gap-1"
                >
                  <span>✏️ Edit Price</span>

              <div className="grid grid-cols-2 gap-2">

                  onClick={() => setEditingProduct(item)}

                  type="button"

      {/* Edit / Add Product Modal */}
      {editingProduct && (
        <ProductFormModal
          product={editingProduct === "new" ? null : editingProduct}

      )}

      {/* Reset Confirmation Modal */}
      {isResetConfirmOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-950/80 backdrop-blur-sm p-4">
          <div className="bg-stone-900 border border-stone-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl text-stone-100 space-y-4">
            <div className="flex items-center gap-3 text-amber-400">
